name: Runner test

# Tries mobai-ci runner on a GitHub macOS runner: an xcfast build, then
# simulators started through the runner's API on one checkout. The job boots
# no simulator itself: the runner makes each one on request, slim before its
# one boot. The binaries come from the draft release "runner-test".
on:
  push:
    branches: [runner-test]

jobs:
  runner:
    runs-on: macos-latest
    timeout-minutes: 50
    permissions:
      contents: write # reads the draft release
    strategy:
      fail-fast: false
      matrix:
        stream: [latency]
        quiet: ["0"]
        bg: ["0"]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # mobai-ci-frames: main plus frame accounting, and a frame cap and
          # size per capture from /tmp/mobai-simshare-mode.
          gh release download runner-test -R "$GITHUB_REPOSITORY" -D bin -p mobai-ci-frames -p xcfast -p encprobe
          mv bin/mobai-ci-frames bin/mobai-ci
          chmod +x bin/*

      - name: Restore the xcfast cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.xcfast
          key: xcfast-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.stream }}-${{ matrix.bg }}-${{ matrix.rep }}
          restore-keys: xcfast-

      - name: Run and probe
        env:
          MOBAI_API_KEY: ${{ secrets.MOBAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LAT: "1"
          HOLD_MINUTES: "0"
          CAPTURE_MODES: "cap30 cap60 nocap full30"
          QUIET: ${{ matrix.quiet }}
          BG: ${{ matrix.bg }}
          BAND: "0"
          PAIRED: "0"
          ENCPROBE: "1"
          MAX_SIMS: "3"
          LABEL: "runner latency"
        run: bash .github/runner-test/probe.sh

      - name: Save the xcfast cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.xcfast
          key: xcfast-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.stream }}-${{ matrix.bg }}-${{ matrix.rep }}
