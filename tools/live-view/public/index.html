<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="rail" aria-label="Sources">
        <header class="brand">
          <p class="eyebrow">MobAI</p>
          <h1>Live View</h1>
          <p class="lede">Screenshots from preview and devices, pulled on a timer.</p>
        </header>

        <section class="panel">
          <div class="panel-head">
            <h2>Sources</h2>
            <button type="button" class="ghost" id="refreshSources">Refresh</button>
          </div>
          <ul class="sources" id="sources"></ul>
        </section>

        <section class="panel controls">
          <label class="field">
            <span>Poll interval</span>
            <select id="interval">
              <option value="800">0.8s</option>
              <option value="1500" selected>1.5s</option>
              <option value="2500">2.5s</option>
              <option value="5000">5s</option>
            </select>
          </label>
          <button type="button" class="primary" id="snapNow">Capture now</button>
        </section>

        <footer class="meta" id="meta">
          <span class="dot" id="liveDot" data-state="idle"></span>
          <span id="metaText">Starting…</span>
        </footer>
      </aside>

      <main class="stage">
        <div class="phone" id="phone">
          <div class="bezel">
            <div class="notch" aria-hidden="true"></div>
            <div class="screen">
              <img id="frame" alt="Latest screenshot" hidden />
              <div class="empty" id="empty">
                <strong>Waiting for a frame</strong>
                <span>Start a preview or connect a simulator / phone, then pick it in the rail.</span>
              </div>
            </div>
          </div>
        </div>
        <p class="hint" id="hint"></p>
      </main>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
